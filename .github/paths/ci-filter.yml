# Path buckets for the tiered CI classifier used by integration.yml and security.yml.
# dorny/paths-filter@v3 evaluates these named filters against a PR's changed files and
# exposes each bucket as a step output ("true"/"false"). Expensive lanes (unit/build
# matrix, cluster + single integration, CodeQL, npm audit) run only when a relevant
# bucket is true, so docs-only and harness-only PRs skip them while the *-pass gate
# jobs still run and report success (a skipped job satisfies a required check).
#
# Locked to scripts/ci-validate-workflows.mjs: keys and referenced paths must stay in sync.

# Source and build inputs that ship in the published package or drive its runtime output.
code:
  - 'src/**'
  - 'package.json'
  - 'package-lock.json'
  - 'tsconfig*.json'
  - 'vite.config.ts'
  - 'vitest.config.ts'
  - 'jest.config.js'
  - 'postcss.config.js'
  - 'eslint/**'
  - 'eslint.config.cjs'
  - '.nvmrc'
  # Build-time generators whose output is embedded in the shipped runtime.
  - 'scripts/build-embed-docs.ts'
  - 'scripts/build-embed-docs-slug-meta.ts'
  - 'scripts/build-sync-skill-versions.mjs'
  - 'scripts/build-vite-ui-env-define.ts'

# Test fixtures and suites that prove code behavior even when src is untouched.
tests:
  - 'tests/**'

# Full-stack infra the CLUSTER lane boots (compose stack + its provisioning scripts).
infra:
  - 'compose/**'
  - '.env*'
  - 'scripts/qdrant-binary.sh'
  - 'scripts/deploy-generate-dev-secrets.py'
  - 'scripts/deploy-configure-keycloak-realms.py'
  - 'scripts/import-test-snapshot.sh'
  - 'scripts/seed-test-snapshot.sh'
  - 'scripts/ci-wait-for-infra.sh'

# CI/dev-harness only: workflow YAML, generator-free scripts, release/renovate config.
# Deliberately overlaps code on the build generators; dorny marks both true and the
# expensive jobs key off code, so a generator edit still runs full CI (harness alone never does).
harness:
  - '.github/**'
  - 'scripts/**'
  - 'renovate.json'
  - 'release-please-config.json'
  - '.release-please-manifest.json'
  - '.devcontainer/**'
