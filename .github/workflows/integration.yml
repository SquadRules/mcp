name: Integration

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run version:check-skills
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run test:spec-parity
      - run: npm run test:ui
      - run: npm run build:tgz
      - run: npm run test:tgz
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: npm-package-node${{ matrix.node }}
          path: artifacts/*.tgz
          if-no-files-found: error

  # CLUSTER lane: full-stack infra (Qdrant, Redis, Keycloak, Postgres) + AUTH on + HTTP transport.
  # Proves the deployed-services path (docker compose --profile fullstack) with all components
  # overridden via shell env. The .env template supplies QDRANT_URL, AUTH_ENABLED=true, etc.;
  # TRANSPORT_TYPE=http overrides the serve default (stdio) so the HTTP server binds.
  verify-integration-cluster:
    name: Cluster (AUTH on, HTTP, full infra, Node 24)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: "Generate .env (fullstack: infra + app + auth)"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/deploy-generate-dev-secrets.py

      - name: Verify .env exists
        run: ls -la .env

      - name: Restore infra Docker image cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: docker-infra-cache
        with:
          path: .cache/docker-infra
          key: infra-docker-${{ hashFiles('compose/infra.yaml') }}

      - name: Load infra Docker images from cache
        if: steps.docker-infra-cache.outputs.cache-hit == 'true'
        run: docker load -i .cache/docker-infra/images.tar

      # Infra + test-harness deps before the built tgz exists on this runner (overlaps with build job wall clock after this job starts).
      - name: Start Docker infra and npm ci (parallel)
        run: |
          set -euo pipefail
          ec=0
          docker compose -p squadrules-mcp --env-file .env -f compose/infra.yaml --profile fullstack up -d valkey qdrant postgres keycloak &
          pid_compose=$!
          npm ci &
          pid_npm=$!
          wait $pid_compose || ec=1
          wait $pid_npm || ec=1
          exit $ec

      - name: Save infra Docker images for cache
        if: steps.docker-infra-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/docker-infra
          # Only save images for services we start (valkey, qdrant, postgres, keycloak); config --images includes app image which is not pulled
          mapfile -t images < <(docker compose -p squadrules-mcp --env-file .env -f compose/infra.yaml --profile fullstack config --format json | jq -r '.services | to_entries[] | select(.key | test("^(valkey|qdrant|postgres|keycloak)$")) | .value.image')
          docker save -o .cache/docker-infra/images.tar "${images[@]}"

      - name: Cache infra Docker images
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.docker-infra-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/docker-infra
          key: infra-docker-${{ hashFiles('compose/infra.yaml') }}

      # Keep artifact outside ./dist — integration tests expect ./dist/cli/index.js (see tests/integration/cli-commands-shared.ts).
      - name: Download npm package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package-node24
          path: artifact-npm

      # E2E tests (e.g. cli-auth-browser-login) use Playwright chromium; separate runner from verify-ui-primary.
      - name: Restore Playwright browsers cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache-integration
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers and wait for infra (parallel)
        id: playwright-install-integration
        run: |
          set -euo pipefail
          ec=0
          npx playwright install chromium &
          pid_pw=$!
          bash scripts/ci-wait-for-infra.sh &
          pid_wait=$!
          wait $pid_pw || ec=1
          wait $pid_wait || ec=1
          exit $ec

      - name: Save Playwright browsers cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.playwright-cache-integration.outputs.cache-hit != 'true' && steps.playwright-install-integration.outcome == 'success'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}

      - name: Configure Keycloak realms and test user
        run: python3 scripts/deploy-configure-keycloak-realms.py

      - name: Install package from tgz
        run: |
          VERSION=$(node -p "require('./package.json').version")
          \
            npm install "./artifact-npm/squadrules-mcp-${VERSION}.tgz"

      - name: Expose installed package dist for CLI tests
        run: |
          rm -rf dist
          cp -R node_modules/@squadrules/mcp/dist ./dist

      - name: Restore Qdrant test snapshot cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: qdrant-snapshot-cache
        with:
          path: |
            .local/qdrant-snapshot/squadrules_ci.snapshot
            .local/qdrant-snapshot/squadrules_ci_traces.snapshot
          key: ${{ runner.os }}-qdrant-snapshot-${{ hashFiles('scripts/seed-test-snapshot.sh', 'scripts/import-test-snapshot.sh', 'tests/test-data/AI_CODING_RULES.md') }}
          restore-keys: |
            ${{ runner.os }}-qdrant-snapshot-

      - name: Start app (from installed package, HTTP transport)
        env:
          HEALTH_CHECK_ATTEMPTS: 15
          KEYCLOAK_INTERNAL_URL: http://localhost:8080
          QDRANT_SNAPSHOT_DIR: var/snapshots
          TRANSPORT_TYPE: http
        run: |
          mkdir -p var/log var/snapshots
          npm start > var/log/squadrules.log 2>&1 &
          for i in $(seq 1 "${HEALTH_CHECK_ATTEMPTS}"); do
            curl -sSf http://127.0.0.1:3300/health >/dev/null && break
            [ "$i" -eq "${HEALTH_CHECK_ATTEMPTS}" ] && exit 1
            sleep 2
          done

      - name: Run unit tests against the deployed test services
        run: TRANSPORT_TYPE=http npm test -- tests/unit

      - name: Run integration tests (AUTH stack + Jest suite)
        env:
          TRANSPORT_TYPE: http
        run: npm test

      - name: Show test failure
        if: failure()
        run: |
          echo "--- Last test report (tail) ---"
          latest=''
          for report in reports/tests/*.log; do
            if [ -f "$report" ] && { [ -z "$latest" ] || [ "$report" -nt "$latest" ]; }; then
              latest=$report
            fi
          done
          if [ -n "$latest" ]; then
            tail -n 200 "$latest"
          else
            echo "No reports/tests/*.log found"
          fi

      - name: Upload squadrules log - check
        if: always() && failure()
        run: |
          pwd
          ls -la var/log 2>/dev/null || true
          if [ -f var/log/squadrules.log ]; then ls -la var/log/squadrules.log; cat var/log/squadrules.log; else echo "No var/log/squadrules.log"; fi

      - name: Upload squadrules log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: squadrules-log-node24
          path: var/log/squadrules.log
          if-no-files-found: ignore

  # SINGLE lane: zero-config (no .env, no infra, no env overrides). Proves the npm package boots
  # and runs the full test suite on the embedded defaults: stdio transport, LanceDB vector store,
  # key-free fastembed embeddings, no auth, no Redis. The setup.ts test harness supplies hermetic
  # XDG_CONFIG_HOME isolation so the lane is clean even on a runner with stale state.
  verify-integration-single:
    name: Single (zero-config, stdio + LanceDB + fastembed, Node 24)
    needs: [build]
    runs-on: ubuntu-latest
    # Cold fastembed model download + CPU ONNX inference of shipped adapters is slow (~10-15min).
    # The full suite under SINGLE runs the same tests as CLUSTER but with env-coupled suites
    # self-skipping (Qdrant-backed, auth-gated). Generous timeout for the first run; subsequent
    # runs benefit from the fastembed model cache if the runner is reused.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download npm package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package-node24
          path: artifact-npm

      - name: Install package from tgz
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm install "./artifact-npm/squadrules-mcp-${VERSION}.tgz"

      - name: Expose installed package dist for CLI tests
        run: |
          rm -rf dist
          cp -R node_modules/@squadrules/mcp/dist ./dist

      - name: Restore fastembed model cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: fastembed-model-cache
        with:
          path: ~/.config/squadrules/models
          key: ${{ runner.os }}-fastembed-model-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-fastembed-model-

      - name: Run unit tests (zero-config SINGLE defaults)
        run: npm test -- tests/unit

      - name: Run stdio integration test (verify SINGLE mode end-to-end)
        # Verifies stdio transport + LanceDB + fastembed work together in zero-config mode.
        # Model cache ensures fastembed initialization is fast even on cold CI runners.
        run: NODE_OPTIONS=--experimental-vm-modules npx jest --runInBand --forceExit --testTimeout=120000 tests/integration/scenarios/spaces-tool.stdio-simple.test.ts

      - name: Save fastembed model cache
        if: always() && steps.fastembed-model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.config/squadrules/models
          key: ${{ steps.fastembed-model-cache.outputs.cache-primary-key }}

      - name: Show test failure
        if: failure()
        run: |
          echo "--- last test report (tail) ---"
          latest=''
          for report in reports/tests/*.log .local/reports/tests/*.log; do
            if [ -f "$report" ] && { [ -z "$latest" ] || [ "$report" -nt "$latest" ]; }; then latest=$report; fi
          done
          if [ -n "$latest" ]; then tail -n 200 "$latest"; else echo "No test report log found"; fi

  # Merge gate: the Node 24/26 build lane plus the two integration lanes (CLUSTER + SINGLE).
  # Container image build/scan/publish is decoupled into SquadRules/containers, not a gate here.
  integration-pass:
    name: Integration workflow passed
    needs: [build, verify-integration-cluster, verify-integration-single]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          for result in ${RESULTS//,/ }; do
            test "$result" = success || exit 1
          done
