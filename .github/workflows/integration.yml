name: Integration

on:
  pull_request:
    # `main` is the release branch; `squadrules-6` is the integration branch PRs are
    # stacked on (e.g. #295), so a main-only trigger never reported a check for them.
    branches: [main, squadrules-6]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.cjs'
      - 'knip.config.ts'
      - 'eslint/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'compose/**'
      - '.agents/skills/**'
  merge_group:
  workflow_dispatch:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  # Validate every event revision, including branch updates and empty PR diffs.
  # Path classification must not turn missing test evidence into a green gate.
  build:
    name: Build and checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit-node
      - run: npm run version:check-skills
      - run: npm run lint
      - run: npm run typecheck
      # Report-only: the wrapper always exits 0 (prints a summary + $GITHUB_STEP_SUMMARY block).
      # The required build lane forbids continue-on-error steps, so the advisory behaviour lives in
      # scripts/ci-typecheck-tests-report.mjs. Scoped to Node 24 to limit duplicate log noise. See #180.
      - name: Type-check tests (report-only; see issue #180)
        if: matrix.node == '24'
        run: npm run typecheck:tests
      - run: npm run knip
      - run: npm run test:spec-parity
      # Canonical-vocabulary parity across transports plus the shared-backend suite
      # selection contract (ADR 0048). Both are pure/unit-level: no infrastructure.
      - run: npm run test:api-spec-parity
      - run: npm run test:ui
      - run: npm run build:tgz
      - run: npm run test:tgz
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: npm-package-node${{ matrix.node }}
          path: artifacts/*.tgz
          if-no-files-found: error

  # CLUSTER lane: full-stack infra (Qdrant, Redis, Keycloak, Postgres) + AUTH on + HTTP transport.
  # Proves the deployed-services path (docker compose --profile fullstack) with all components
  # overridden via shell env. The .env template supplies QDRANT_URL, AUTH_ENABLED=true, etc.;
  # TRANSPORT_TYPE=http overrides the serve default (stdio) so the HTTP server binds.
  verify-integration-cluster:
    name: Cluster (AUTH on, HTTP, full infra, Node 24)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: "Generate .env (fullstack: infra + app + auth)"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/deploy-generate-dev-secrets.py

      - name: Verify .env exists
        run: ls -la .env

      - name: Restore infra Docker image cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: docker-infra-cache
        with:
          path: .cache/docker-infra
          key: infra-docker-${{ hashFiles('compose/infra.yaml') }}

      - name: Load infra Docker images from cache
        if: steps.docker-infra-cache.outputs.cache-hit == 'true'
        run: docker load -i .cache/docker-infra/images.tar

      # Infra + test-harness deps before the built tgz exists on this runner (overlaps with build job wall clock after this job starts).
      - name: Start Docker infra and npm ci (parallel)
        run: |
          set -euo pipefail
          ec=0
          docker compose -p squadrules-mcp --env-file .env -f compose/infra.yaml --profile fullstack up -d valkey qdrant postgres keycloak &
          pid_compose=$!
          npm ci &
          pid_npm=$!
          wait $pid_compose || ec=1
          wait $pid_npm || ec=1
          exit $ec

      - name: Save infra Docker images for cache
        if: steps.docker-infra-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/docker-infra
          # Only save images for services we start (valkey, qdrant, postgres, keycloak); config --images includes app image which is not pulled
          mapfile -t images < <(docker compose -p squadrules-mcp --env-file .env -f compose/infra.yaml --profile fullstack config --format json | jq -r '.services | to_entries[] | select(.key | test("^(valkey|qdrant|postgres|keycloak)$")) | .value.image')
          docker save -o .cache/docker-infra/images.tar "${images[@]}"

      - name: Cache infra Docker images
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.docker-infra-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/docker-infra
          key: infra-docker-${{ hashFiles('compose/infra.yaml') }}

      # Keep artifact outside ./dist — integration tests expect ./dist/cli/index.js (see tests/integration/cli-commands-shared.ts).
      - name: Download npm package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package-node24
          path: artifact-npm

      # E2E tests (e.g. cli-auth-browser-login) use Playwright chromium; separate runner from verify-ui-primary.
      - name: Restore Playwright browsers cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache-integration
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers and wait for infra (parallel)
        id: playwright-install-integration
        run: |
          set -euo pipefail
          ec=0
          npx playwright install chromium &
          pid_pw=$!
          bash scripts/ci-wait-for-infra.sh &
          pid_wait=$!
          wait $pid_pw || ec=1
          wait $pid_wait || ec=1
          exit $ec

      - name: Save Playwright browsers cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.playwright-cache-integration.outputs.cache-hit != 'true' && steps.playwright-install-integration.outcome == 'success'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}

      - name: Configure Keycloak realms and test user
        run: python3 scripts/deploy-configure-keycloak-realms.py

      - name: Install package from tgz
        run: |
          VERSION=$(node -p "require('./package.json').version")
          \
            npm install "./artifact-npm/squadrules-mcp-${VERSION}.tgz"

      - name: Expose installed package dist for CLI tests
        run: |
          rm -rf dist
          cp -R node_modules/@squadrules/mcp/dist ./dist

      # Qdrant snapshot cache disabled (2026-10-15):
      # The snapshot only contained 1 test adapter (AI_CODING_RULES.md), not the 20-50
      # initially expected. The 12 boot-injected app adapters (src/embed-docs/mem/) are
      # always trained at startup, and warm boot is fast (~2s) thanks to the version-skip
      # fix (PR #45). The snapshot mechanism was also broken: seed script requires
      # review_evidence (critic-loop verdict) and had an unbound variable bug.
      # Not worth maintaining cache for a single adapter.
      # - name: Restore Qdrant test snapshot cache
      #   uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      #   id: qdrant-snapshot-cache
      #   with:
      #     path: |
      #       .local/qdrant-snapshot/squadrules_ci.snapshot
      #       .local/qdrant-snapshot/squadrules_ci_traces.snapshot
      #     key: ${{ runner.os }}-qdrant-snapshot-${{ hashFiles('scripts/seed-test-snapshot.sh', 'scripts/import-test-snapshot.sh', 'tests/test-data/AI_CODING_RULES.md') }}
      #     restore-keys: |
      #       ${{ runner.os }}-qdrant-snapshot-

      - name: Start app (from installed package, HTTP transport)
        env:
          HEALTH_CHECK_ATTEMPTS: 15
          KEYCLOAK_INTERNAL_URL: http://localhost:8080
          QDRANT_SNAPSHOT_DIR: var/snapshots
          TRANSPORT_TYPE: http
        run: |
          mkdir -p var/log var/snapshots
          npm start > var/log/squadrules.log 2>&1 &
          for i in $(seq 1 "${HEALTH_CHECK_ATTEMPTS}"); do
            curl -sSf http://127.0.0.1:3300/health >/dev/null && break
            [ "$i" -eq "${HEALTH_CHECK_ATTEMPTS}" ] && exit 1
            sleep 2
          done

      - name: Run unit tests against the deployed test services
        run: TRANSPORT_TYPE=http npm test -- tests/unit

      - name: Run integration tests (AUTH stack + Jest suite)
        env:
          TRANSPORT_TYPE: http
        run: npm test

      - name: Show test failure
        if: failure()
        run: |
          echo "--- Last test report (tail) ---"
          latest=''
          for report in reports/tests/*.log; do
            if [ -f "$report" ] && { [ -z "$latest" ] || [ "$report" -nt "$latest" ]; }; then
              latest=$report
            fi
          done
          if [ -n "$latest" ]; then
            tail -n 200 "$latest"
          else
            echo "No reports/tests/*.log found"
          fi

      - name: Upload squadrules log - check
        if: always() && failure()
        run: |
          pwd
          ls -la var/log 2>/dev/null || true
          if [ -f var/log/squadrules.log ]; then ls -la var/log/squadrules.log; cat var/log/squadrules.log; else echo "No var/log/squadrules.log"; fi

      - name: Upload squadrules log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: squadrules-log-node24
          path: var/log/squadrules.log
          if-no-files-found: ignore

  # SINGLE lane: zero-config (no .env, no infra, no env overrides). Proves the npm package boots
  # and runs the full test suite on the embedded defaults: stdio transport, LanceDB vector store,
  # key-free fastembed embeddings, no auth, no Redis. The setup.ts test harness supplies hermetic
  # SQUADRULES_HOME isolation so the lane is clean even on a runner with stale state.
  verify-integration-single:
    name: Single (zero-config, stdio + LanceDB + fastembed, Node 24)
    needs: [build]
    runs-on: ubuntu-latest
    # Cold fastembed model download + CPU ONNX inference of shipped adapters is slow (~10-15min).
    # The full suite under SINGLE runs the same tests as CLUSTER but with env-coupled suites
    # self-skipping (Qdrant-backed, auth-gated). Generous timeout for the first run; subsequent
    # runs benefit from the fastembed model cache if the runner is reused.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download npm package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package-node24
          path: artifact-npm

      - name: Install package from tgz
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm install "./artifact-npm/squadrules-mcp-${VERSION}.tgz"

      - name: Expose installed package dist for CLI tests
        run: |
          rm -rf dist
          cp -R node_modules/@squadrules/mcp/dist ./dist

      - name: Restore fastembed model cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: fastembed-model-cache
        with:
          path: ~/.cache/embedding-models
          key: ${{ runner.os }}-fastembed-model-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-fastembed-model-

      - name: Run unit tests (zero-config SINGLE defaults)
        run: npm test -- tests/unit

      - name: Run stdio integration test (verify SINGLE mode end-to-end)
        # Verifies stdio transport + LanceDB + fastembed work together in zero-config mode.
        # Model cache ensures fastembed initialization is fast even on cold CI runners.
        run: NODE_OPTIONS=--experimental-vm-modules npx jest --runInBand --forceExit --testTimeout=120000 tests/integration/scenarios/spaces-tool.stdio-simple.test.ts

      - name: Save fastembed model cache
        if: always() && steps.fastembed-model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/embedding-models
          key: ${{ steps.fastembed-model-cache.outputs.cache-primary-key }}

      - name: Show test failure
        if: failure()
        run: |
          echo "--- last test report (tail) ---"
          latest=''
          for report in reports/tests/*.log .local/reports/tests/*.log; do
            if [ -f "$report" ] && { [ -z "$latest" ] || [ "$report" -nt "$latest" ]; }; then latest=$report; fi
          done
          if [ -n "$latest" ]; then tail -n 200 "$latest"; else echo "No test report log found"; fi

  # SHARED-BACKEND lane: a real ArangoDB 3.11 as a test-owned service container
  # (ADR 0044, ADR 0048). The graph port has two implementations; the embedded
  # LadybugDB lanes cannot detect a port divergence, so shared parity needs a server.
  #
  # Three required suite groups share that one disposable container budget:
  #   1. shared-backend parity (real ArangoDB, `SQUADRULES_ARANGO_REQUIRED=true`);
  #   2. mock-free embedded boot / instance / inheritance / topology (real LadybugDB +
  #      LanceDB, no mocks, no network);
  #   3. the shipped-package API suites, booting `dist/bootstrap.js` from the build
  #      job's tarball over real HTTP.
  # One job, not three: the container starts once and no group can be scheduled without
  # the others — a second job could let one group pass while another never ran.
  #
  # Deliberately neither path-filtered nor `if:`-gated: a conditional lane is a
  # skippable lane, and `integration-pass` requires this job unconditionally. The
  # service is disposable, runs without authentication, mounts nothing, publishes no
  # image, and never leaves the job. `SQUADRULES_ARANGO_REQUIRED=true` turns an
  # unconfigured run into a failure, so deleting the `env:` block below cannot turn
  # this job green with zero executed assertions.
  #
  # The job name is left unchanged so an already-registered required-check name stays
  # stable; read it as "every graph lane" (the three groups above).
  verify-integration-graph:
    name: Graph (ArangoDB 3.11 shared backend, Node 24)
    needs: [build]
    runs-on: ubuntu-latest
    # Arango parity is fast. Group 3 is not: every API suite boots the shipped server
    # with real ONNX fastembed, so the budget has to cover all three groups.
    timeout-minutes: 40
    services:
      arangodb:
        image: arangodb:3.11
        env:
          ARANGO_NO_AUTH: '1'
        ports:
          - 8529:8529
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Group 3 boots the *shipped* entry (`dist/bootstrap.js`, what Docker and
      # `squadrules serve` run), so it consumes the tarball the build job packed for
      # this same revision instead of rebuilding from source and testing other bytes.
      - name: Download npm package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package-node24
          path: artifact-npm

      - name: Install package from tgz
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm install "./artifact-npm/squadrules-mcp-${VERSION}.tgz"

      - name: Expose installed package dist for the API suites
        run: |
          rm -rf dist
          cp -R node_modules/@squadrules/mcp/dist ./dist

      # The suites themselves assert the served series and a real stream-transaction
      # round-trip; this step only waits for the endpoint and creates the database the
      # deployment URL points at. A 409 means a retried container already created it.
      - name: Wait for ArangoDB and create the test database
        run: |
          set -euo pipefail
          endpoint=http://127.0.0.1:8529
          ready=''
          for attempt in $(seq 1 60); do
            if curl -fsS "$endpoint/_api/version" >/dev/null; then ready=1; break; fi
            echo "waiting for ArangoDB ($attempt/60)"
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::ArangoDB 3.11 did not become ready on $endpoint"
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$endpoint/_api/database" \
            -H 'content-type: application/json' --data '{"name":"squadrules_it"}')
          if [ "$status" != '201' ] && [ "$status" != '409' ]; then
            echo "::error::could not create database squadrules_it (HTTP $status)"
            exit 1
          fi

      - name: Run shared-backend integration suites against real ArangoDB
        env:
          SQUADRULES_ARANGO_URL: http://127.0.0.1:8529
          SQUADRULES_ARANGO_DATABASE: squadrules_it
          SQUADRULES_ARANGO_REQUIRED: 'true'
        run: >-
          NODE_OPTIONS=--experimental-vm-modules npx jest
          tests/integration/graph-db-arango-shared.test.ts
          tests/integration/graph-db-arango-evolution.test.ts
          tests/integration/graph-db-arango-history-link-fault.test.ts
          --runInBand --forceExit --testTimeout=120000

      # Group 2: real embedded LadybugDB + LanceDB through the production boot and
      # projection code — no mocks, no module fakes, no network (the write path's `tei`
      # provider has no endpoint, so the real call fails over to zero vectors).
      - name: Run mock-free embedded graph suites
        run: npm run test:graph-embedded

      # Group 3: every child server the API suites boot reuses this one weight cache
      # (the child env helper forwards the ambient cache dirs), so the download happens
      # once per lockfile change instead of once per boot.
      - name: Restore fastembed model cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: fastembed-model-cache
        with:
          path: ~/.cache/embedding-models
          key: ${{ runner.os }}-fastembed-model-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-fastembed-model-

      # Default dist + default embedded graph: no backend override here, so the suites
      # prove the shipped package's own defaults.
      - name: Run shipped-package graph API suites
        run: npm run test:graph-api

      # Issue #297: nothing in CI asserted how the shipped server *stops*. This boots
      # `dist/bootstrap.js` with the real fastembed/ONNX model and proves two properties
      # ADR 0049 depends on: SIGTERM drains to a natural exit 0 (shutdown marker present;
      # bounded last resort and native abort absent), and a failed bind exits 1 through
      # the same drain instead of `process.exit(1)` against a live InferenceSession. The
      # third property - a listener that registers after shutdown began closes itself
      # rather than holding the event loop - has no deterministic process-level trigger,
      # so it is proven where it is reachable: `tests/unit/shutdown-registry.test.ts`.
      # Runs after the cache restore above so the weights are reused rather than
      # re-downloaded per boot. `integration-pass` requires this step through `GRAPH`.
      - name: Run real-model shutdown regression gate (issue #297)
        run: npm run test:shutdown

      - name: Save fastembed model cache
        if: always() && steps.fastembed-model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/embedding-models
          key: ${{ steps.fastembed-model-cache.outputs.cache-primary-key }}

  # Merge gate: the Node 24/26 build lane plus the integration lanes (CLUSTER, SINGLE,
  # shared GRAPH). Container image build/scan/publish is decoupled into
  # SquadRules/containers, not a gate here.
  integration-pass:
    name: Integration workflow passed
    needs: [build, verify-integration-cluster, verify-integration-graph, verify-integration-single]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          BUILD: ${{ needs.build.result }}
          CLUSTER: ${{ needs.verify-integration-cluster.result }}
          GRAPH: ${{ needs.verify-integration-graph.result }}
          SINGLE: ${{ needs.verify-integration-single.result }}
        run: |
          set -euo pipefail
          echo "build=$BUILD cluster=$CLUSTER graph=$GRAPH single=$SINGLE"
          # Require positive evidence from every lane; skipped or empty is not success.
          test "$BUILD" = "success"
          test "$CLUSTER" = "success"
          # Issue #297: verify-integration-graph also runs `npm run test:shutdown` (the
          # real-model shutdown regression gate). This line is what makes that gate
          # required: a lane that skips or fails the step reports GRAPH != success here.
          test "$GRAPH" = "success"
          test "$SINGLE" = "success"
