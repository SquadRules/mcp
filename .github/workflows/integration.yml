name: Integration

# No secrets: every lane embeds with the local fastembed default (docs/adr/0004), so CI needs no
# OpenAI key at all. `verify-openai-key.yml` is the only OpenAI surface left and it is a manual
# diagnostic, not a test lane.
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run version:check-skills
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run test:spec-parity
      - run: npm run test:ui
      - run: npm run build:tgz
      - run: npm run test:tgz
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: npm-package-node${{ matrix.node }}
          path: artifacts/*.tgz
          if-no-files-found: error

  # Cluster mode: the full-suite lane on the Docker fullstack substrate (Qdrant + Valkey/Redis +
  # Keycloak + Postgres), AUTH on. Gated; see integration-pass.
  verify-integration-cluster:
    name: Integration tests (cluster mode, AUTH on, Node 24)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      # Cost policy (docs/adr/0004): test lanes embed locally with fastembed so neither boot
      # injection nor test writes consume OpenAI quota. The fullstack .env generator validates
      # every SECRET_KEYS (incl. OPENAI_API_KEY) is non-empty after writing, so a throwaway value
      # is supplied ONLY so generation passes; the next step blanks it and pins fastembed.
      - name: "Generate .env (fullstack: infra + app + auth)"
        env:
          OPENAI_API_KEY: ci-keyfree-placeholder
        run: python3 scripts/deploy-generate-dev-secrets.py

      - name: Force key-free fastembed embeddings
        run: |
          set -euo pipefail
          # Blank the throwaway key and override the template's full-stack EMBEDDING_PROVIDER=openai,
          # which would otherwise make the boot probe fail once the key is gone. Model weights use the
          # default per-user path (~/.config/squadrules/models), cached by the step below.
          sed -i 's|^OPENAI_API_KEY=.*|OPENAI_API_KEY=|' .env
          sed -i 's|^EMBEDDING_PROVIDER=.*|EMBEDDING_PROVIDER=fastembed|' .env
          grep -E '^(OPENAI_API_KEY|EMBEDDING_PROVIDER)=' .env
          if grep -qE '^EMBEDDING_PROVIDER=(openai|tei)$' .env; then echo "::error::cluster lane must not select an external provider"; exit 1; fi

      - name: Verify .env exists
        run: ls -la .env

      - name: Restore infra Docker image cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: docker-infra-cache
        with:
          path: .cache/docker-infra
          key: infra-docker-${{ hashFiles('compose.yaml') }}

      - name: Load infra Docker images from cache
        if: steps.docker-infra-cache.outputs.cache-hit == 'true'
        run: docker load -i .cache/docker-infra/images.tar

      # Infra + test-harness deps before the built tgz exists on this runner (overlaps with build job wall clock after this job starts).
      - name: Start Docker infra and npm ci (parallel)
        run: |
          set -euo pipefail
          ec=0
          docker compose -p squadrules-mcp --env-file .env --profile fullstack up -d valkey qdrant postgres keycloak &
          pid_compose=$!
          npm ci &
          pid_npm=$!
          wait $pid_compose || ec=1
          wait $pid_npm || ec=1
          exit $ec

      - name: Save infra Docker images for cache
        if: steps.docker-infra-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/docker-infra
          # Only save images for services we start (valkey, qdrant, postgres, keycloak); config --images includes app image which is not pulled
          mapfile -t images < <(docker compose -p squadrules-mcp --env-file .env --profile fullstack config --format json | jq -r '.services | to_entries[] | select(.key | test("^(valkey|qdrant|postgres|keycloak)$")) | .value.image')
          docker save -o .cache/docker-infra/images.tar "${images[@]}"

      - name: Cache infra Docker images
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.docker-infra-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/docker-infra
          key: infra-docker-${{ hashFiles('compose.yaml') }}

      # Keep artifact outside ./dist — integration tests expect ./dist/cli/index.js (see tests/integration/cli-commands-shared.ts).
      - name: Download npm package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package-node24
          path: artifact-npm

      # E2E tests (e.g. cli-auth-browser-login) use Playwright chromium; separate runner from verify-ui-primary.
      - name: Restore Playwright browsers cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache-integration
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers and wait for infra (parallel)
        id: playwright-install-integration
        run: |
          set -euo pipefail
          ec=0
          npx playwright install chromium &
          pid_pw=$!
          bash scripts/ci-wait-for-infra.sh &
          pid_wait=$!
          wait $pid_pw || ec=1
          wait $pid_wait || ec=1
          exit $ec

      - name: Save Playwright browsers cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.playwright-cache-integration.outputs.cache-hit != 'true' && steps.playwright-install-integration.outcome == 'success'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}

      - name: Configure Keycloak realms and test user
        run: python3 scripts/deploy-configure-keycloak-realms.py

      - name: Install package from tgz
        run: |
          VERSION=$(node -p "require('./package.json').version")
          \
            npm install "./artifact-npm/squadrules-mcp-${VERSION}.tgz"

      - name: Expose installed package dist for CLI tests
        run: |
          rm -rf dist
          cp -R node_modules/@squadrules/mcp/dist ./dist

      - name: Restore Qdrant test snapshot cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: qdrant-snapshot-cache
        with:
          path: |
            .local/qdrant-snapshot/squadrules_ci.snapshot
            .local/qdrant-snapshot/squadrules_ci_traces.snapshot
          key: ${{ runner.os }}-qdrant-snapshot-${{ hashFiles('scripts/seed-test-snapshot.sh', 'scripts/import-test-snapshot.sh', 'tests/test-data/AI_CODING_RULES.md') }}
          restore-keys: |
            ${{ runner.os }}-qdrant-snapshot-

      # Local embedding weights are ~hundreds of MB and are fetched from HuggingFace on first use.
      # Cached so a cold ONNX boot does not also pay a download per run. Keyed on the module that
      # pins FASTEMBED_MODEL, so changing the model invalidates the cache.
      - name: Restore fastembed model cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: fastembed-model-cache-cluster
        with:
          path: ~/.config/squadrules/models
          key: ${{ runner.os }}-fastembed-models-${{ hashFiles('src/config/embedding-fastembed.ts') }}
          restore-keys: |
            ${{ runner.os }}-fastembed-models-

      - name: Start app (from installed package)
        env:
          # The HTTP server binds only AFTER boot injection has trained the shipped mem adapters
          # (src/index.ts awaits injectMemResourcesAtBoot before startHttpTransport). The version
          # reuse rule (docs/adr/0002) makes a warm store boot near-instantly, but a CI runner is
          # ephemeral: its store is cold, so every run pays the CPU ONNX embedding of all adapters
          # (minutes). Generous cap; the loop breaks on the first healthy response.
          HEALTH_CHECK_ATTEMPTS: 120
          KEYCLOAK_INTERNAL_URL: http://localhost:8080
          QDRANT_SNAPSHOT_DIR: var/snapshots
        run: |
          mkdir -p var/log var/snapshots
          npm run dev:start:installed > var/log/squadrules.log 2>&1 &
          for i in $(seq 1 "${HEALTH_CHECK_ATTEMPTS}"); do
            curl -sSf http://127.0.0.1:3300/health >/dev/null && break
            [ "$i" -eq "${HEALTH_CHECK_ATTEMPTS}" ] && exit 1
            sleep 2
          done

      - name: Run unit tests against the deployed test services
        run: npm run dev:test -- tests/unit

      - name: Run integration tests (AUTH stack + Jest suite)
        run: npm run dev:test

      - name: Save fastembed model cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.fastembed-model-cache-cluster.outputs.cache-hit != 'true'
        with:
          path: ~/.config/squadrules/models
          key: ${{ steps.fastembed-model-cache-cluster.outputs.cache-primary-key }}

      - name: Show test failure
        if: failure()
        run: |
          echo "--- Last test report (tail) ---"
          latest=''
          for report in reports/tests/*.log; do
            if [ -f "$report" ] && { [ -z "$latest" ] || [ "$report" -nt "$latest" ]; }; then
              latest=$report
            fi
          done
          if [ -n "$latest" ]; then
            tail -n 200 "$latest"
          else
            echo "No reports/tests/*.log found"
          fi

      - name: Upload squadrules log - check
        if: always() && failure()
        run: |
          pwd
          ls -la var/log 2>/dev/null || true
          if [ -f var/log/squadrules.log ]; then ls -la var/log/squadrules.log; cat var/log/squadrules.log; else echo "No var/log/squadrules.log"; fi

      - name: Upload squadrules log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: squadrules-log-node24
          path: var/log/squadrules.log
          if-no-files-found: ignore

  # Single mode: the zero-infrastructure product path, and now a GATE rather than an advisory lane.
  # Runs the FULL integration suite twice — once over HTTP against one long-lived app, then over
  # stdio (each MCP connection spawns its own server process) — on the embedded LanceDB backend,
  # auth off, with nothing started in Docker. fastembed embeddings only (docs/adr/0004): no
  # OpenAI key anywhere. Substrate and coverage deltas are recorded in docs/adr/0006.
  verify-integration-single:
    name: Integration tests (single mode, AUTH off, Node 24)
    needs: [build]
    runs-on: ubuntu-latest
    # One full-suite stdio pass on CPU ONNX. The store is never cached (docs/adr/0003), so the
    # first process start re-embeds the shipped adapters; every later start (each stdio child)
    # hits the version-reuse skip (docs/adr/0002) but still pays a model load. Raise this only
    # with a measured reason.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      # One XDG base for the whole job. The app writes the embedded LanceDB store under it, and
      # TEST_XDG_CONFIG_HOME hands the same dir to the test harness — otherwise deploy-run-env.sh
      # isolates each run in a throwaway dir, hiding the app's store from the stdio children it
      # spawns and making every child re-embed from scratch. $HOME/.config is also the product
      # default, so the fastembed weights keep landing in the path the shared model cache reads.
      - name: Resolve single-mode config home
        run: echo "SINGLE_CONFIG_HOME=$HOME/.config" >> "$GITHUB_ENV"

      # Cost policy (docs/adr/0004): the .env generator validates every SECRET_KEYS (incl.
      # OPENAI_API_KEY) is non-empty after writing, so a throwaway value is supplied ONLY so
      # generation passes; the guard step below blanks it and pins the local provider.
      - name: "Generate .env (base vars, overridden for simple mode)"
        env:
          OPENAI_API_KEY: ci-keyfree-placeholder
        run: python3 scripts/deploy-generate-dev-secrets.py

      - name: Force embedded backend and key-free fastembed
        run: |
          set -euo pipefail
          # Blank QDRANT_URL in .env (the app loads it through dotenv) and .env.dev_stdio (the
          # harness sources .env then .env.<ENV>, and stdio children inherit that environment).
          # Empty => isQdrantConfigured=false => embedded LanceDB, and Qdrant-substrate suites
          # self-skip via describeQdrantBackend(); the cluster lane covers them.
          sed -i 's|^QDRANT_URL=.*|QDRANT_URL=|' .env .env.dev_stdio
          sed -i 's|^OPENAI_API_KEY=.*|OPENAI_API_KEY=|' .env .env.dev_stdio
          sed -i 's|^EMBEDDING_PROVIDER=.*|EMBEDDING_PROVIDER=fastembed|' .env .env.dev_stdio
          if grep -qE '^EMBEDDING_PROVIDER=(openai|tei)$' .env .env.dev_stdio; then
            echo "::error::single lane must not select an external provider"; exit 1;
          fi
          if grep -qE '^QDRANT_URL=.' .env .env.dev_stdio; then
            echo "::error::single lane must run the embedded backend (QDRANT_URL must stay blank)"; exit 1;
          fi
          grep -E '^(QDRANT_URL|OPENAI_API_KEY|EMBEDDING_PROVIDER)=' .env .env.dev_stdio

      - name: Install dependencies
        run: npm ci

      - name: Download npm package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package-node24
          path: artifact-npm

      - name: Install package from tgz
        run: |
          VERSION=$(node -p "require('./package.json').version")
          \
            npm install "./artifact-npm/squadrules-mcp-${VERSION}.tgz"

      - name: Expose installed package dist for CLI tests
        run: |
          rm -rf dist
          cp -R node_modules/@squadrules/mcp/dist ./dist

      # Same cache key and path as the cluster lane: one warm weights cache serves both lanes.
      - name: Restore fastembed model cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: fastembed-model-cache-single
        with:
          path: ~/.config/squadrules/models
          key: ${{ runner.os }}-fastembed-models-${{ hashFiles('src/config/embedding-fastembed.ts') }}
          restore-keys: |
            ${{ runner.os }}-fastembed-models-

      - name: Restore Playwright browsers cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: playwright-cache-single
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}

      # The HTTP test pass installs Chromium itself (deploy-run-env.sh test() is idempotent); doing
      # it here keeps the download out of the test step's clock, as the cluster lane does.
      - name: Install Playwright browsers
        id: playwright-install-single
        run: npx playwright install chromium

      - name: Save Playwright browsers cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.playwright-cache-single.outputs.cache-hit != 'true' && steps.playwright-install-single.outcome == 'success'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}

      # TRANSPORT_TYPE=stdio comes from .env.dev_stdio; the HTTP-gated suites self-skip, the stdio
      # suites run, and each spawned server reuses the same store dir (boot injection then hits the
      # version-reuse skip instead of re-embedding).
      - name: Run integration tests (stdio transport, full suite)
        env:
          CI: "true"
          ENV: dev_stdio
          QDRANT_COLLECTION: squadrules_ci
          TEST_XDG_CONFIG_HOME: ${{ env.SINGLE_CONFIG_HOME }}
        run: npm run dev_stdio:test

      - name: Save fastembed model cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.fastembed-model-cache-single.outputs.cache-hit != 'true'
        with:
          path: ~/.config/squadrules/models
          key: ${{ steps.fastembed-model-cache-single.outputs.cache-primary-key }}

      - name: Show test failure
        if: failure()
        run: |
          echo "--- last test report (tail) ---"
          latest=''
          for report in reports/tests/*.log .local/reports/tests/*.log; do
            if [ -f "$report" ] && { [ -z "$latest" ] || [ "$report" -nt "$latest" ]; }; then latest=$report; fi
          done
          if [ -n "$latest" ]; then tail -n 200 "$latest"; else echo "No test report log found"; fi

      - name: Upload single-mode test reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: squadrules-single-reports-node24
          path: .local/reports/tests
          if-no-files-found: ignore

  # Merge gate: the Node 24/26 build lane plus the two Node 24 integration lanes. Both lanes run
  # the FULL integration suite and both are gated (no continue-on-error): cluster mode proves the
  # Docker fullstack substrate with AUTH on, single mode proves the zero-infrastructure product
  # path over HTTP and stdio (docs/adr/0006). Container image build/scan/publish is decoupled into
  # SquadRules/containers, not a gate here.
  integration-pass:
    name: Integration workflow passed
    needs: [build, verify-integration-cluster, verify-integration-single]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          for result in ${RESULTS//,/ }; do
            test "$result" = success || exit 1
          done
