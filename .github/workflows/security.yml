# Security scans for the npm package: dependency review (PRs), npm audit and CodeQL (SAST).
# Container base-image OS scanning and .trivyignore expiry live in SquadRules/containers, which
# builds, scans and signs the images FROM this published package.
name: Security

on:
  workflow_call:
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Daily 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          # Optional: deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Remediation belongs to npm-audit-fix.yml, never a validation workspace.
      - run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml
      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript"

  # Merge gate: all security jobs must pass.
  security-pass:
    name: Security workflow passed
    needs: [dependency-review, npm-audit, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        env:
          NPM_AUDIT: ${{ needs.npm-audit.result }}
          CODEQL: ${{ needs.codeql.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "npm-audit=$NPM_AUDIT codeql=$CODEQL"

          test "$NPM_AUDIT" = "success"
          test "$CODEQL" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$DEPENDENCY_REVIEW" = "success"
          else
            test "$DEPENDENCY_REVIEW" = "skipped"
          fi
          echo "All security jobs passed."
