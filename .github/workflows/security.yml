# Security scans: dependency review (PRs), npm audit, CodeQL (SAST), base-image Trivy (OS only).
# Trivy scans Alpine OS only (vuln-type=os). We use the same FROM ref as Dockerfile plus the same
# apk upgrade line — scanning the raw digest alone would miss that layer (upstream image can still
# trail Alpine security fixes). No npm / app install. Full image+library scan: release.yml.
name: Security

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  schedule:
    # Daily 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivyignore-expiry:
    name: Trivy ignore expiry guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIVYIGNORE_EXPIRY_WARNING_DAYS: "45"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate .trivyignore expiry dates
        run: |
          python3 scripts/ci-check-trivyignore-expiry.py \
            --file .trivyignore \
            --warning-days "$TRIVYIGNORE_EXPIRY_WARNING_DAYS"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Optional: deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: ${{ github.event_name == 'pull_request' }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: npm audit with auto-remediation
        run: |
          set -euo pipefail
          
          # Function to check for project vulnerabilities (excluding npm's bundled deps)
          check_project_vulns() {
            local audit_output
            audit_output=$(npm audit --json 2>/dev/null || true)
            
            # Filter out vulnerabilities that ONLY exist in npm's bundled dependencies
            local project_vulns
            project_vulns=$(echo "$audit_output" | node -e "
              const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
              const vulns = data.vulnerabilities || {};
              const projectVulns = Object.entries(vulns).filter(([name, vuln]) => {
                const nodes = vuln.nodes || [];
                // Keep if at least one node is NOT in npm's bundled deps
                return nodes.some(n => !n.includes('node_modules/npm/node_modules/'));
              });
              console.log(projectVulns.length);
            ")
            
            if [ "$project_vulns" = "0" ]; then
              return 0
            else
              return 1
            fi
          }
          
          # Try audit first (excluding npm's bundled deps)
          if check_project_vulns; then
            echo "✓ No high/critical vulnerabilities in project dependencies"
            exit 0
          fi
          
          echo "::warning::Vulnerabilities detected, attempting auto-remediation..."
          
          # Try npm audit fix
          npm audit fix || true
          
          # Check if files changed
          if git diff --quiet package.json package-lock.json; then
            echo "npm audit fix did not change files, trying --force..."
            npm audit fix --force || true
          fi
          
          # Check again if files changed
          if git diff --quiet package.json package-lock.json; then
            echo "::error::Could not auto-remediate project vulnerabilities"
            npm audit --audit-level=high
            exit 1
          fi
          
          # Files changed, commit them
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR flow: commit to the PR branch (detached HEAD, push to head_ref)
            git add package.json package-lock.json
            git commit -m "fix(deps): auto-remediate npm audit vulnerabilities"
            git push origin HEAD:"$HEAD_REF"
            echo "✓ Committed dependency updates to PR branch"
          else
            # Scheduled/push flow: open a PR
            BRANCH="auto/npm-audit-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git add package.json package-lock.json
            git commit -m "fix(deps): auto-remediate npm audit vulnerabilities"
            git push -u origin "$BRANCH"
            PR_URL=$(gh pr create --title "fix(deps): auto-remediate npm audit vulnerabilities" \
                         --body "Automated dependency updates from scheduled security scan." \
                         --label "dependencies")
            gh pr merge --auto --squash "$PR_URL"
            echo "✓ Opened PR with dependency updates (auto-merge enabled)"
          fi
          
          # Re-run audit to verify
          if ! check_project_vulns; then
            echo "::error::Vulnerabilities still present after auto-remediation"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
          HEAD_REF: ${{ github.head_ref }}

  container-base-os-trivy:
    name: Base image OS (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: ${{ github.event_name == 'pull_request' }}
          fetch-depth: 0

      - name: Base image ref from Dockerfile
        id: base
        run: |
          line=$(grep -m1 '^FROM ' Dockerfile)
          ref="${line#FROM }"
          ref="${ref%% AS *}"
          echo "image_ref=$(echo "$ref" | xargs)" >> "$GITHUB_OUTPUT"
          # Extract image name and current digest
          img="${ref%%@*}"
          digest="${ref##*@}"
          echo "image_name=$img" >> "$GITHUB_OUTPUT"
          echo "current_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: One-layer image (FROM + apk upgrade RUN from Dockerfile)
        run: |
          img="${{ steps.base.outputs.image_ref }}"
          run_cmd=$(grep -E '^RUN apk update && apk upgrade --no-cache$' Dockerfile | sed 's/^RUN //' | head -1)
          if [ -z "$run_cmd" ]; then echo "::error::Expected \"RUN apk update && apk upgrade --no-cache\" line in Dockerfile"; exit 1; fi
          printf 'FROM %s\nRUN %s\n' "$img" "$run_cmd" | docker build -t kairos-os:ci -

      - name: Trivy scan (attempt)
        id: trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: kairos-os:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          vuln-type: os

      - name: Auto-remediate base image
        if: steps.trivy-scan.outcome == 'failure'
        id: remediate
        run: |
          set -euo pipefail
          img_name="${{ steps.base.outputs.image_name }}"
          
          echo "::warning::Trivy found vulnerabilities, attempting base image update..."
          
          # Pull the latest tag to get the new digest
          docker pull "$img_name" --quiet
          new_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$img_name" | sed 's/.*@//')
          old_digest="${{ steps.base.outputs.current_digest }}"
          
          if [ "$new_digest" = "$old_digest" ]; then
            echo "::error::Base image is already at latest digest but still has vulnerabilities"
            exit 1
          fi
          
          echo "Updating Dockerfile: $old_digest -> $new_digest"
          sed -i "s|$old_digest|$new_digest|g" Dockerfile
          
          # Rebuild with new base image
          run_cmd=$(grep -E '^RUN apk update && apk upgrade --no-cache$' Dockerfile | sed 's/^RUN //' | head -1)
          printf 'FROM %s\nRUN %s\n' "$img_name@$new_digest" "$run_cmd" | docker build -t kairos-os:ci -
          
          echo "new_digest=$new_digest" >> "$GITHUB_OUTPUT"

      - name: Trivy rescan (verify remediation)
        if: steps.trivy-scan.outcome == 'failure'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kairos-os:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          vuln-type: os

      - name: Commit base image update
        if: steps.trivy-scan.outcome == 'failure' && success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR flow: commit to the PR branch (detached HEAD, push to head_ref)
            git add Dockerfile
            git commit -m "fix(docker): auto-update base image to remediate Trivy vulnerabilities"
            git push origin HEAD:"$HEAD_REF"
            echo "✓ Committed base image update to PR branch"
          else
            # Scheduled/push flow: open a PR
            BRANCH="auto/trivy-base-image-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git add Dockerfile
            git commit -m "fix(docker): auto-update base image to remediate Trivy vulnerabilities"
            git push -u origin "$BRANCH"
            PR_URL=$(gh pr create --title "fix(docker): auto-update base image to remediate Trivy vulnerabilities" \
                         --body "Automated base image update from scheduled security scan." \
                         --label "dependencies")
            gh pr merge --auto --squash "$PR_URL"
            echo "✓ Opened PR with base image update (auto-merge enabled)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: javascript
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.38.2
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:javascript"

  # Merge gate: all security jobs must pass.
  security-pass:
    name: Security workflow passed
    needs: [dependency-review, trivyignore-expiry, npm-audit, container-base-os-trivy, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        env:
          TRIVYIGNORE_EXPIRY: ${{ needs.trivyignore-expiry.result }}
          NPM_AUDIT: ${{ needs.npm-audit.result }}
          CONTAINER_TRIVY: ${{ needs.container-base-os-trivy.result }}
          CODEQL: ${{ needs.codeql.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "trivyignore-expiry=$TRIVYIGNORE_EXPIRY npm-audit=$NPM_AUDIT container-base-os-trivy=$CONTAINER_TRIVY codeql=$CODEQL"

          test "$TRIVYIGNORE_EXPIRY" = "success"
          test "$NPM_AUDIT" = "success"
          test "$CONTAINER_TRIVY" = "success"
          test "$CODEQL" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$DEPENDENCY_REVIEW" = "success"
          else
            test "$DEPENDENCY_REVIEW" = "skipped"
          fi
          echo "All security jobs passed."
