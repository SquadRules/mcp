# Qoder wiki lifecycle: incremental updates for a completed main/en wiki, fresh
# bootstrap for missing or foreign-branch output, deliberate manual regeneration.
# All Qoder runs execute in a disposable local clone; only validated output is
# copied back, committed on a docs branch, and proposed through a PR.
# Generated wiki output is deliberately excluded from push triggers to avoid loops.
# The downstream GitHub Wiki sync remains a separate workflow.

name: Docs wiki regeneration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto (incremental or bootstrap), or explicit full regeneration'
        type: choice
        required: true
        default: auto
        options:
          - auto
          - regenerate
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - '.agents/**'
      - '.qoder/repowiki/wiki_plan.yaml'

permissions:
  contents: read

concurrency:
  group: docs-wiki-main
  cancel-in-progress: false

jobs:
  regenerate-wiki:
    name: Regenerate Qoder wiki
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
      pr_sha: ${{ steps.create-pr.outputs.pr_sha }}
    steps:
      - name: Generate GitHub App token (SquadRules auto)
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AUTO_APP_ID }}
          private-key: ${{ secrets.AUTO_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture wiki diagnostics
        run: |
          set -uo pipefail
          # The generation step below fails on every run with "no local wiki found for
          # branch=main language=en", which is scoped to the branch+language key rather
          # than to repository state. Capture the inputs the CLI keys on instead of
          # guessing them: the committed generation stamp, the resolved branch, and the
          # flags the installed wiki component actually supports.
          LOG=wiki-diagnostics.log
          : > "$LOG"
          {
            echo '== workspace =='
            pwd
            ls -la || true
            echo '== .qoder layout =='
            ls -la .qoder .qoder/repowiki .qoder/repowiki/en || true
            tree -L 3 .qoder || find .qoder -maxdepth 3 | sort || true
            echo '== plan file discovery =='
            find . -maxdepth 4 -name wiki_plan.yaml || true
            cat .qoder/repowiki/wiki_plan.yaml || true
            echo '== tracked wiki files =='
            git ls-files .qoder/repowiki | wc -l || true
            echo '== git state =='
            git rev-parse --abbrev-ref HEAD || true
            git log -1 --oneline || true
            git status --porcelain | head -20 || true
            echo '== generation stamp in committed metadata =='
            node -e '
              const fs = require("node:fs");
              const p = ".qoder/repowiki/en/meta/repowiki-metadata.json";
              const meta = JSON.parse(fs.readFileSync(p, "utf8"));
              const repo = meta.wiki_repo || {};
              console.log(JSON.stringify({
                wiki_repo_name: repo.name,
                progress_status: repo.progress_status,
                wiki_present_status: repo.wiki_present_status,
                wiki_items: Array.isArray(meta.wiki_items) ? meta.wiki_items.length : 0,
                bytes: fs.statSync(p).size,
              }, null, 2));
            ' || true
            echo '== qodercli version and wiki flags =='
            npx -y @qoder-ai/qodercli@latest --version || true
            npx -y @qoder-ai/qodercli@latest wiki --help || true
          } 2>&1 | tee "$LOG"

      - name: Upload wiki diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: wiki-diagnostics
          path: wiki-diagnostics.log
          if-no-files-found: warn

      - name: Regenerate Qoder wiki
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          REQUESTED_WIKI_MODE: ${{ inputs.mode || 'auto' }}
        run: |
          set -euo pipefail
          MODE="$(node scripts/wiki-generation-state.mjs mode "$GITHUB_WORKSPACE" "$REQUESTED_WIKI_MODE")"
          echo "Qoder generation mode: $MODE"
          # The final component must be "mcp": Qoder records the checkout
          # directory name as wiki_repo.name alongside its git branch identity.
          TEMP_ROOT="$(mktemp -d "$RUNNER_TEMP/qoder-wiki.XXXXXXXX")"
          trap 'rm -rf "$TEMP_ROOT"' EXIT
          GEN="$TEMP_ROOT/mcp"
          git clone --local --no-hardlinks "$GITHUB_WORKSPACE" "$GEN"
          test "$(git -C "$GEN" branch --show-current)" = main
          if [ "$MODE" = bootstrap ]; then
            # Discard the foreign-branch wiki only in the disposable clone.
            rm -rf "$GEN/.qoder/repowiki/en"
          fi
          (
            cd "$GEN"
            case "$MODE" in
              update)
                npx -y @qoder-ai/qodercli@latest wiki --update \
                  -f .qoder/repowiki/wiki_plan.yaml --repo . --branch main --language en ;;
              bootstrap)
                npx -y @qoder-ai/qodercli@latest wiki \
                  -f .qoder/repowiki/wiki_plan.yaml --repo . --branch main --language en ;;
              regenerate)
                npx -y @qoder-ai/qodercli@latest wiki --regenerate \
                  -f .qoder/repowiki/wiki_plan.yaml --repo . --branch main --language en ;;
            esac
          )
          node scripts/wiki-generation-state.mjs validate "$GEN" "$GITHUB_WORKSPACE"
          rsync -a --delete "$GEN/.qoder/repowiki/en/" "$GITHUB_WORKSPACE/.qoder/repowiki/en/"
          if [ -d "$GEN/.qoder/repowiki/knowledge" ]; then
            mkdir -p "$GITHUB_WORKSPACE/.qoder/repowiki/knowledge"
            rsync -a --delete "$GEN/.qoder/repowiki/knowledge/" "$GITHUB_WORKSPACE/.qoder/repowiki/knowledge/"
          fi
          echo "Validated $MODE wiki output before copying to the PR workspace"

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          # Staging captures new pages and deleted pages, unlike git diff alone.
          git add -A .qoder/repowiki/
          if git diff --cached --quiet -- .qoder/repowiki/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No wiki changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- .qoder/repowiki/
          fi

      - name: Create docs PR
        id: create-pr
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="docs/wiki-regen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "squadrules-auto[bot]"
          git config user.email "343860684+squadrules-auto[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "docs: regenerate Qoder wiki from source"
          # Checkout deliberately persists no credentials; use the App token.
          gh auth setup-git
          git push origin "$BRANCH"
          PR_SHA="$(git rev-parse HEAD)"
          # No labels are needed: exact PR identity is passed to the merge job.
          PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main --head "$BRANCH" --title "docs: regenerate Qoder wiki" \
            --body "Automated, validated Qoder wiki generation for main. Resolves #205.")"
          PR_NUMBER="${PR_URL##*/}"
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid PR URL: $PR_URL" >&2; exit 1; }
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_sha=$PR_SHA" >> "$GITHUB_OUTPUT"
          echo "Created wiki PR #$PR_NUMBER ($PR_SHA)"


  auto-merge:
    name: Auto-merge docs PR
    needs: regenerate-wiki
    if: needs.regenerate-wiki.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token (SquadRules auto)
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AUTO_APP_ID }}
          private-key: ${{ secrets.AUTO_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Auto-merge the docs PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ needs.regenerate-wiki.outputs.pr_number }}
          PR_SHA: ${{ needs.regenerate-wiki.outputs.pr_sha }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER" && test -n "$PR_SHA"
          # Never select a different PR based on age, label or bot identity.
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --auto --squash --delete-branch --match-head-commit "$PR_SHA"
          echo "Auto-merge requested for wiki PR #$PR_NUMBER"
