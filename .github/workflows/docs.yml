# Docs bot: update the Qoder wiki when source changes, open a docs-typed PR,
# and auto-merge via the SquadRules auto GitHub App. This keeps the wiki in sync with code
# without manual intervention. The wiki is code-derivable (never hand-edit
# .qoder/repowiki/en/content/); this workflow updates it incrementally from source.
#
# Triggers: workflow_dispatch (manual) and push to main for the paths declared as
# wiki inputs in .qoder/repowiki/wiki_plan.yaml (src/**, docs/**, .agents/**) plus the
# plan file itself, so the trigger scope and the declared generation scope cannot drift.
# Generated output lands only under .qoder/repowiki/**, which is deliberately NOT in the
# filter: a merged wiki-regeneration PR must not retrigger generation. Publishing that
# output stays in sync-qoder-repowiki-to-github-wiki.yml, which is untouched.
# The docs bot uses QODER_PERSONAL_ACCESS_TOKEN
# to run the Qoder CLI wiki generation, and AUTO_APP_ID + AUTO_APP_PRIVATE_KEY
# to create and auto-merge the PR. Schedule trigger disabled to reduce CI noise.

name: Docs wiki regeneration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - '.agents/**'
      - '.qoder/repowiki/wiki_plan.yaml'

permissions:
  contents: read

jobs:
  regenerate-wiki:
    name: Regenerate Qoder wiki
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Generate GitHub App token (SquadRules auto)
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AUTO_APP_ID }}
          private-key: ${{ secrets.AUTO_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture wiki diagnostics
        run: |
          set -uo pipefail
          # The generation step below fails on every run with "no local wiki found for
          # branch=main language=en", which is scoped to the branch+language key rather
          # than to repository state. Capture the inputs the CLI keys on instead of
          # guessing them: the committed generation stamp, the resolved branch, and the
          # flags the installed wiki component actually supports.
          LOG=wiki-diagnostics.log
          : > "$LOG"
          {
            echo '== workspace =='
            pwd
            ls -la || true
            echo '== .qoder layout =='
            ls -la .qoder .qoder/repowiki .qoder/repowiki/en || true
            tree -L 3 .qoder || find .qoder -maxdepth 3 | sort || true
            echo '== plan file discovery =='
            find . -maxdepth 4 -name wiki_plan.yaml || true
            cat .qoder/repowiki/wiki_plan.yaml || true
            echo '== tracked wiki files =='
            git ls-files .qoder/repowiki | wc -l || true
            echo '== git state =='
            git rev-parse --abbrev-ref HEAD || true
            git log -1 --oneline || true
            git status --porcelain | head -20 || true
            echo '== generation stamp in committed metadata =='
            node -e '
              const fs = require("node:fs");
              const p = ".qoder/repowiki/en/meta/repowiki-metadata.json";
              const meta = JSON.parse(fs.readFileSync(p, "utf8"));
              const repo = meta.wiki_repo || {};
              console.log(JSON.stringify({
                wiki_repo_name: repo.name,
                progress_status: repo.progress_status,
                wiki_present_status: repo.wiki_present_status,
                wiki_items: Array.isArray(meta.wiki_items) ? meta.wiki_items.length : 0,
                bytes: fs.statSync(p).size,
              }, null, 2));
            ' || true
            echo '== qodercli version and wiki flags =='
            npx -y @qoder-ai/qodercli@latest --version || true
            npx -y @qoder-ai/qodercli@latest wiki --help || true
          } 2>&1 | tee "$LOG"

      - name: Upload wiki diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: wiki-diagnostics
          path: wiki-diagnostics.log
          if-no-files-found: warn

      - name: Regenerate Qoder wiki
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Qoder CLI wiki incremental update (.qoder/repowiki/en/content/ from source).
          # --update regenerates only pages affected by source changes, not the full wiki.
          npx -y @qoder-ai/qodercli@latest wiki --update -f .qoder/repowiki/wiki_plan.yaml --repo . --language en
          echo "Wiki updated at $(date -u)"

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet .qoder/repowiki/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No wiki changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Wiki changes detected:"
            git diff --stat .qoder/repowiki/
          fi

      - name: Create docs PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          BRANCH="docs/wiki-regen-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .qoder/repowiki/
          git commit -m "docs: regenerate Qoder wiki from source"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: regenerate Qoder wiki" \
            --body "Automated wiki regeneration from source. This PR was opened by the Docs bot workflow." \
            --label "documentation,automerge"
          echo "PR created for branch $BRANCH"

  auto-merge:
    name: Auto-merge docs PR
    needs: regenerate-wiki
    if: needs.regenerate-wiki.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token (SquadRules auto)
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AUTO_APP_ID }}
          private-key: ${{ secrets.AUTO_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Auto-merge the docs PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Find the most recent docss PR opened by the bot (within last hour).
          PR_NUMBER=$(gh pr list --state open --author "github-actions[bot]" --label "documentation,automerge" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "No docs PR found to auto-merge."
            exit 0
          fi
          echo "Auto-merging PR #$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch
          echo "Auto-merge enabled for PR #$PR_NUMBER"
