name: Automation policy

on:
  workflow_call:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Automation policy passed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.6'
          cache: false
      - run: npm ci
      - name: Conventional Commit title
        run: node scripts/ci-automation.mjs title
      - run: npm run test:automation
      - run: npm run test:audit-fix-workflow
      - run: npm run lint:workflows
      - run: npm run lint:renovate
