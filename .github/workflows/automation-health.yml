name: Automation health

on:
  schedule:
    - cron: '7 * * * *'
  workflow_run:
    workflows: [Renovate, npm audit fix, Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: automation-health
  cancel-in-progress: false

jobs:
  health:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Detect stale producers and incomplete releases; deduplicate incidents
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-health.mjs
