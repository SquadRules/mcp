# Sequentially update, check, and merge open PRs.
# Triggers: push to main (immediate) and workflow_run after the docs wiki
# regeneration or the Release workflow completes. Release is included because
# its auto-merge-release-pr job merges a release PR into main, changing the
# base — auto-update must not merge feature PRs before that lands. The
# conclusion of those workflows is irrelevant; auto-update only needs them
# to finish.
# PRs are processed sequentially; successful validation workflow completion
# also wakes the updater even when main has not advanced. Mandatory Integration,
# Security and Automation policy gates must all pass for the current head.
# Redundant managed dependency PRs are closed, not merged as empty commits.
# No local clone/merge/push or mergeStateStatus polling.
# Uses the SquadRules auto GitHub App for write access to PR branches.
name: Auto-update PR branches

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Docs wiki regeneration, Release, Integration, Security, Automation policy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-update-prs
  cancel-in-progress: false

jobs:
  update-prs:
    name: Update open PR branches
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Generate GitHub App token (SquadRules auto)
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AUTO_APP_ID }}
          private-key: ${{ secrets.AUTO_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read

      - name: Sequentially update, check, and merge open PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Candidates: open PRs into main, not draft, no no-auto-update label.
          # NOTE: --limit 100 caps at 100 open PRs.
          PRS=$(gh pr list --repo "$REPO" --state open --base main --limit 100 \
            --json number,isDraft,labels \
            --jq '.[] | select(.isDraft == false and ([.labels[].name] | contains(["no-auto-update"]) | not)) | .number')

          if [ -z "$PRS" ]; then
            echo "No open PRs to consider"
            exit 0
          fi

          # Process PRs sequentially, never inferring that visible checks are all
          # the required checks. A workflow_run completion will retry deferred PRs.
          while IFS= read -r PR; do
            if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
              echo "::warning::Unexpected PR identifier from list: '$PR'"
              continue
            fi

            UPDATE_OUT=$(gh pr update-branch "$PR" --repo "$REPO" 2>&1) || {
              echo "::warning::gh pr update-branch failed for PR #$PR: $UPDATE_OUT"
              continue
            }
            echo "$UPDATE_OUT"

            # Refresh after update-branch; an update may have absorbed all changes
            # from a Dependabot or Renovate PR. Closing zero-diff bot PRs is safer
            # than manufacturing a merge just to clear the queue.
            DETAILS=$(gh api "repos/$REPO/pulls/$PR")
            if [ "$(jq -r '.state' <<< "$DETAILS")" != "open" ]; then
              continue
            fi
            HEAD_SHA=$(jq -r '.head.sha' <<< "$DETAILS")
            HEAD_BRANCH=$(jq -r '.head.ref' <<< "$DETAILS")
            HEAD_REPO=$(jq -r '.head.repo.full_name' <<< "$DETAILS")
            CHANGED_FILES=$(jq -r '.changed_files' <<< "$DETAILS")
            AUTHOR=$(jq -r '.user.login' <<< "$DETAILS")
            AUTHOR_ID=$(jq -r '.user.id' <<< "$DETAILS")

            if [ "$CHANGED_FILES" = "0" ]; then
              if [ "$HEAD_REPO" = "$REPO" ] &&
                { { [ "$AUTHOR" = 'dependabot[bot]' ] && [ "$AUTHOR_ID" = '49699333' ] && [[ "$HEAD_BRANCH" == dependabot/* ]]; } ||
                  { [ "$AUTHOR" = 'renovate[bot]' ] && [ "$AUTHOR_ID" = '29139614' ] && [[ "$HEAD_BRANCH" == renovate/* ]]; }; }; then
                gh pr comment "$PR" --repo "$REPO" --body "Closing as superseded: this managed dependency update now has zero changed files against main. The requested changes are already incorporated upstream."
                gh pr close "$PR" --repo "$REPO"
                echo "PR #$PR: closed redundant managed dependency update"
              else
                echo "::notice::PR #$PR has no diff; leaving non-managed PR open for review"
              fi
              continue
            fi

            # A change to the PR head may queue new CI, and gh pr checks only
            # watches checks which actually exist. It does not prove that all
            # mandatory workflow gates were scheduled.
            if ! gh pr checks "$PR" --repo "$REPO" --watch --fail-fast; then
              echo "::warning::PR #$PR failed an available check; no merge"
              continue
            fi
            RUNS=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")
            GATES_READY=true
            for WORKFLOW in integration security automation-policy; do
              if ! jq -e \
                --arg file ".github/workflows/$WORKFLOW.yml" \
                --arg sha "$HEAD_SHA" \
                --arg branch "$HEAD_BRANCH" \
                --arg repo "$REPO" \
                '([.workflow_runs[] | select(.path == $file and .head_sha == $sha and .head_branch == $branch and .head_repository.full_name == $repo and .event == "pull_request")] | sort_by(.run_number, .run_attempt, .id) | last) as $latest | ($latest != null and $latest.status == "completed" and $latest.conclusion == "success")' \
                <<< "$RUNS" >/dev/null; then
                echo "::notice::PR #$PR missing a successful current-head $WORKFLOW gate; merge deferred"
                GATES_READY=false
                break
              fi
            done
            if [ "$GATES_READY" != "true" ]; then
              continue
            fi

            # Repository rules remain authoritative; never override their checks.
            # --auto preserves eligibility when a final branch-protection check
            # is still being recalculated, and --match-head-commit rejects races.
            if gh pr merge "$PR" --repo "$REPO" --auto --squash --match-head-commit "$HEAD_SHA"; then
              echo "PR #$PR: auto-merge accepted for head $HEAD_SHA"
            else
              echo "::warning::PR #$PR: GitHub rejected auto-merge"
            fi
          done <<< "$PRS"
