# Automatically merge main into open PR branches that have fallen behind.
# Triggers on push to main so branches stay current without manual intervention.
# Uses the Docs GitHub App for write access to push to PR branches (including forks).
# Only performs git merge operations — does not run arbitrary code from PR branches.
name: Auto-update PR branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-update-prs
  cancel-in-progress: false

jobs:
  list-prs:
    name: Find PRs that need updating
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.find.outputs.prs }}
    steps:
      - name: Generate GitHub App token (Docs bot)
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Find open PRs that are behind
        id: find
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016
          PR_JSON=$(gh api graphql -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                pullRequests(states: OPEN, baseRefName: "main", first: 100) {
                  nodes {
                    number
                    isDraft
                    mergeStateStatus
                    headRefName
                    headRepository { nameWithOwner }
                    labels(first: 20) { nodes { name } }
                  }
                }
              }
            }
          ' -f owner="${REPO%/*}" -f repo="${REPO#*/}")

          # Filter: not draft, BEHIND, no no-auto-update label
          echo "$PR_JSON" | jq -c '
            [.data.repository.pullRequests.nodes[]
            | select(
                .isDraft == false
                and .mergeStateStatus == "BEHIND"
                and ([.labels.nodes[].name] | contains(["no-auto-update"]) | not)
              )
            | {
                number: .number,
                head_ref: .headRefName,
                head_repo: .headRepository.nameWithOwner
              }
            ]' > prs.json

          PRS=$(cat prs.json)
          echo "prs=$PRS" >> "$GITHUB_OUTPUT"
          echo "Found $(echo "$PRS" | jq length) PRs that need updating"

  update-branch:
    name: "Update PR #${{ matrix.pr.number }}"
    needs: list-prs
    if: needs.list-prs.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: auto-update-pr-${{ matrix.pr.number }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.list-prs.outputs.prs) }}
    steps:
      - name: Generate GitHub App token (Docs bot)
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge main into PR branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ matrix.pr.number }}
          HEAD_REF: ${{ matrix.pr.head_ref }}
          HEAD_REPO: ${{ matrix.pr.head_repo }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Validate refs against safe patterns to prevent injection
          safe_ref_pattern='^[a-zA-Z0-9._/-]+$'
          if [[ ! "$HEAD_REF" =~ $safe_ref_pattern ]] || [[ "$HEAD_REF" == *".."* ]] || [[ "$HEAD_REF" == .* ]]; then
            echo "::error::Unsafe ref: HEAD_REF='$HEAD_REF'"
            exit 1
          fi
          if [[ ! "$HEAD_REPO" =~ ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Unsafe repo: HEAD_REPO='$HEAD_REPO'"
            exit 1
          fi
          if [[ ! "$REPO" =~ ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Unsafe repo: REPO='$REPO'"
            exit 1
          fi

          # Clone the PR head repo (supports forks)
          gh repo clone "$HEAD_REPO" work -- --branch "$HEAD_REF" --depth=50
          cd work

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch main from the upstream repo
          git remote add upstream "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch upstream main --depth=50

          # Attempt merge
          if git merge upstream/main --no-edit -m "Merge branch 'main' into $HEAD_REF"; then
            echo "Merge succeeded — pushing update to PR #$PR_NUMBER"
            git push origin "HEAD:$HEAD_REF"
          else
            echo "Merge failed (conflicts) — aborting and commenting on PR #$PR_NUMBER"
            git merge --abort
            gh pr comment "$PR_NUMBER" --body \
              "⚠️ Auto-update attempted but merge conflicts detected. Please resolve conflicts manually."
            exit 1
          fi
