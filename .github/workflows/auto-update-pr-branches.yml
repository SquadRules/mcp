# Automatically update open PR branches that have fallen behind main.
# Triggers on push to main plus an hourly backstop run.
# Detection and merge are delegated to `gh pr update-branch` (GitHub's
# server-side update-branch endpoint): it exits 0 without touching the branch
# when the PR is already current, and merges the base head into the PR branch
# when it is behind. No local clone/merge/push, and no mergeStateStatus
# polling — that field is recomputed asynchronously and is stale right after
# the push that triggers this run, so filtering on it silently finds nothing.
# Uses the Docs GitHub App for write access to PR branches.
name: Auto-update PR branches

on:
  push:
    branches: [main]
  schedule:
    # Backstop: anything a push-triggered run missed (API blip, transient
    # failure) is retried here instead of waiting for the next push to main.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-update-prs
  cancel-in-progress: false

jobs:
  update-prs:
    name: Update open PR branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App token (Docs bot)
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update every open non-draft PR branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Candidates: open PRs into main, not draft, no no-auto-update label.
          # NOTE: --limit 100 caps at 100 open PRs.
          PRS=$(gh pr list --repo "$REPO" --state open --base main --limit 100 \
            --json number,isDraft,labels \
            --jq '.[] | select(.isDraft == false and ([.labels[].name] | contains(["no-auto-update"]) | not)) | .number')

          if [ -z "$PRS" ]; then
            echo "No open PRs to consider"
            exit 0
          fi

          # `gh pr update-branch` no-ops (exit 0) when the branch is current
          # and merges main into it when behind. Failures (deleted head ref,
          # merge conflict, fork restriction) must not fail the run for the
          # remaining PRs, so they are reported as warnings.
          while IFS= read -r PR; do
            # PR identifiers come from gh pr list; accept digits only so no
            # event-derived value can reach the shell unvalidated.
            if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
              echo "::warning::Unexpected PR identifier from list: '$PR'"
              continue
            fi
            if gh pr update-branch "$PR" --repo "$REPO"; then
              echo "PR #$PR processed"
            else
              echo "::warning::gh pr update-branch failed for PR #$PR (deleted head ref, merge conflict, or fork restriction)"
            fi
          done <<< "$PRS"
