name: npm audit fix

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Assess and prepare fixes without PR mutations
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-audit-fix
  cancel-in-progress: false

jobs:
  assess:
    if: vars.AUTOMATION_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.audit.outputs.changed }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Assess and fix with no repository credential
        id: audit
        run: node scripts/ci-audit.mjs
      - uses: actions/upload-artifact@v5
        if: steps.audit.outputs.changed == 'true'
        with:
          name: audit-fix
          include-hidden-files: true
          if-no-files-found: error
          path: |
            package.json
            package-lock.json
            .local/npm-audit-fix/before.json
            .local/npm-audit-fix/after.json

  publish:
    needs: assess
    if: needs.assess.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create repository-scoped SquadRules auto App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.AUTO_APP_ID }}
          private-key: ${{ secrets.AUTO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read

      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: audit-fix
      - name: Publish only manifest changes through the verified identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTOMATION_USER_ID: ${{ vars.AUTOMATION_USER_ID }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          SOURCE_SHA: ${{ needs.assess.outputs.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}
        run: node scripts/ci-audit.mjs publish
