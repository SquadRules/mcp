name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview the next version without publishing
        type: boolean
        default: true

permissions:
  contents: read

# Never cancel a publisher halfway through npm/tag/GitHub Release publication.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  integration:
    if: github.repository == 'SquadRules/mcp' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/integration.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  security:
    if: github.repository == 'SquadRules/mcp' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/security.yml
  policy:
    if: github.repository == 'SquadRules/mcp' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/automation-policy.yml

  publish:
    needs: [integration, security, policy]
    if: github.repository == 'SquadRules/mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Release (or preview)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            npm run release -- --dry-run
          else
            npm run release
          fi
