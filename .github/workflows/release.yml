name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview the next version without publishing
        type: boolean
        default: true

permissions:
  contents: read

# Never cancel a publisher halfway through npm/tag/GitHub Release publication.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  integration:
    if: github.repository == 'SquadRules/mcp' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/integration.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  security:
    if: github.repository == 'SquadRules/mcp' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/security.yml
  policy:
    if: github.repository == 'SquadRules/mcp' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/automation-policy.yml

  publish:
    needs: [integration, security, policy]
    if: github.repository == 'SquadRules/mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Release (or preview)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}
          # The repository's pre-push hook refuses any push of refs/tags/v* so developers cannot
          # cut release tags by hand, but `prepare: husky` installs that hook into this checkout
          # (on npm ci AND again on the npm pack inside semantic-release), which also blocks
          # semantic-release's own sanctioned tag push (runs 37313583239, 37324905156, 37327188173).
          # Point core.hooksPath at git's stock sample-only directory via GIT_CONFIG_* command-line
          # scope, which outranks the file husky rewrites mid-run, so the re-install cannot undo it.
          # Do not use HUSKY=0: husky's install then writes "HUSKY=0 skip install" to stdout and
          # @semantic-release/npm reads npm pack stdout as the tarball name, failing before the push
          # (run 37320320913). The developer guard in .husky/pre-push stays in force everywhere else.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}/.git/hooks
        run: |
          if [ "$DRY_RUN" = true ]; then
            npm run release -- --dry-run
          else
            npm run release
          fi

      - name: Verify published release identity
        if: github.event_name != 'workflow_dispatch' || inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A non-releasable push leaves HEAD at the event SHA. A real release
          # advances HEAD with @semantic-release/git before semantic-release tags it.
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "No release was produced for this push."
            exit 0
          fi

          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          HEAD_SHA="$(git rev-parse HEAD)"

          git fetch origin main --tags
          MAIN_SHA="$(git rev-parse origin/main)"
          TAG_SHA="$(git rev-list -n 1 "$TAG")"

          test "$HEAD_SHA" = "$MAIN_SHA"
          test "$HEAD_SHA" = "$TAG_SHA"

          for _ in 1 2 3 4 5; do
            NPM_VERSION="$(npm view "@squadrules/mcp@$VERSION" version 2>/dev/null || true)"
            [ "$NPM_VERSION" = "$VERSION" ] && break
            sleep 2
          done
          test "$NPM_VERSION" = "$VERSION"

          gh release view "$TAG" --json tagName,isDraft,isPrerelease >/tmp/release.json
          test "$(node -p "JSON.parse(require('node:fs').readFileSync('/tmp/release.json','utf8')).tagName")" = "$TAG"

          echo "Verified source/main/tag/GitHub/npm release identity: $VERSION @ $HEAD_SHA"
