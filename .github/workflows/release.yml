# Single npm OIDC publisher and release environment. Every stage uses the resolved
# immutable source; recovery reuses checksummed artifacts, never an old tag/new tree.
name: Release

on:
  workflow_run:
    workflows: [Integration, Security, Automation policy]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview the semantic version without publishing
        type: boolean
        default: true
      validate-artifacts:
        description: Also prepare and validate all artifacts during a dry run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  # Release runs by default from its own triggers (main push, hourly reconciliation,
  # manual dispatch); it is intentionally NOT gated by vars.AUTOMATION_ENABLED, which
  # only pauses the dependency producers/controller. Production vs non-production is
  # decided by branch: main -> stable, any other branch dispatched -> prerelease channel.
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write # delete unrecoverable untagged-* orphan drafts left by interrupted runs
      actions: read
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      sha: ${{ steps.resolve.outputs.sha }}
      branch: ${{ steps.resolve.outputs.branch }}
      recovery: ${{ steps.resolve.outputs.recovery }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve exact validated source or oldest incomplete release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-release.mjs resolve

  prepare:
    needs: resolve
    if: needs.resolve.outputs.skip == 'false' && needs.resolve.outputs.recovery == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_BRANCH: ${{ needs.resolve.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compute version once (semantic-release preview, no publication)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          KAIROS_PRERELEASE_BRANCH: ${{ needs.resolve.outputs.branch != 'main' && needs.resolve.outputs.branch || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'true' || 'false' }}
          VALIDATE_ARTIFACTS: ${{ inputs.validate-artifacts && 'true' || 'false' }}
        run: npm run ci:release -- plan
      - uses: azure/setup-helm@v5
        if: steps.plan.outputs.skip == 'false'
        with:
          version: v4.0.5
      - name: Prepare and consumer-test versioned npm and Helm packages
        if: steps.plan.outputs.skip == 'false'
        run: npm run ci:release -- package
      - uses: docker/setup-qemu-action@v4
        if: steps.plan.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@v4
        if: steps.plan.outputs.skip == 'false'
      - name: Install OCI transport
        if: steps.plan.outputs.skip == 'false'
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y skopeo
      - name: Build immutable multi-platform OCI archive and smoke-test both platforms
        if: steps.plan.outputs.skip == 'false'
        run: npm run ci:release -- images
      - name: Validate amd64 before any publication
        if: steps.plan.outputs.skip == 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: .local/release/scan-amd64.tar
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
      - name: Validate arm64 before any publication
        if: steps.plan.outputs.skip == 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: .local/release/scan-arm64.tar
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
      - name: Seal source, version, validation evidence and artifact checksums
        if: steps.plan.outputs.skip == 'false'
        env:
          VALIDATION_PASSED: 'true'
        run: npm run ci:release -- seal
      - uses: actions/upload-artifact@v5
        id: artifact
        if: steps.plan.outputs.skip == 'false'
        with:
          name: prepared-release-${{ needs.resolve.outputs.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          path: |
            .local/release/package.tgz
            .local/release/image.oci.tar
            .local/release/chart.tgz
            .local/release/chart-config.json
            .local/release/*sbom.json
            .local/release/validation.json
            .local/release/manifest.json
            .local/release/plan.json

  publish:
    needs: [resolve, prepare]
    if: >-
      always() && !failure() && !cancelled() &&
      needs.resolve.outputs.skip == 'false' &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry-run) &&
      (needs.resolve.outputs.recovery != '' || needs.prepare.outputs.skip == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      RECOVERY_ID: ${{ needs.resolve.outputs.recovery }}
      RECOVERY_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact }}
      QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        if: needs.resolve.outputs.recovery == ''
        with:
          name: prepared-release-${{ needs.resolve.outputs.sha }}
          path: .local/release
      - name: Install OCI transport
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y skopeo
      - uses: oras-project/setup-oras@v1
        with:
          version: '1.3.0'
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Persist, publish immutable versions, verify, then promote aliases
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: node scripts/ci-release.mjs publish
