{{- $gw := default dict .Values.gateway }}
{{- $tls := default dict $gw.tls }}
{{- $certManager := default dict $tls.certManager }}
{{- $hasTLS := or $certManager.enabled $tls.secretName }}
{{- $allowHttpWithTLS := default false $gw.allowHttpWithTls }}
{{- $mode := include "mcp.ingressMode" . | trim }}
{{- $gwClass := include "mcp.resolvedGatewayClass" . | trim }}
{{- $infraAnnotations := default dict $gw.infrastructureAnnotations }}
{{- if and $gw.enabled $gw.createGateway $gw.hostname (eq $mode "gateway") $gwClass }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gw.gatewayName | default "kairos-gateway" }}
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name | quote }}
spec:
  gatewayClassName: {{ $gwClass }}
  {{- if $infraAnnotations }}
  infrastructure:
    annotations:
      {{- toYaml $infraAnnotations | nindent 6 }}
  {{- end }}
  listeners:
    {{- if or (not $hasTLS) $allowHttpWithTLS }}
    - name: http
      protocol: HTTP
      port: {{ $gw.httpPort | default 80 }}
      hostname: {{ $gw.hostname }}
    {{- end }}
    {{- if $hasTLS }}
    - name: https
      protocol: HTTPS
      port: {{ $gw.httpsPort | default 443 }}
      hostname: {{ $gw.hostname }}
      {{- if $certManager.enabled }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $certManager.secretName | default (printf "%s-gateway-tls" .Release.Name) }}
      {{- else if $tls.secretName }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $tls.secretName }}
      {{- end }}
    {{- end }}
{{- end }}
