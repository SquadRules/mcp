apiVersion: v2
name: mcp
description: SquadRules MCP application chart. Deploys the MCP server with Qdrant, optional Redis/Valkey, Keycloak and Postgres operator CRs.
type: application
version: 0.15.0
appVersion: "4.8.6"
icon: https://raw.githubusercontent.com/SquadRules/charts/main/mcp/logo.svg
keywords:
  - squadrules
  - mcp
maintainers:
  - name: SquadRules
    url: https://github.com/SquadRules/charts
dependencies:
  - name: qdrant
    version: "1.17.0"
    repository: https://qdrant.github.io/qdrant-helm
    condition: qdrant.enabled
  - name: valkey
    version: "0.9.4"
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled
