# Infrastructure services for CI integration tests and devcontainer.
# The app itself runs via npm on the host (or inside the devcontainer);
# no app service is defined here. @squadrules/mcp is an npm-only package;
# container images are built in SquadRules/containers from the published
# npm package.
#
# Default (mini): Qdrant only. No profile needed.
#   docker compose -p squadrules-mcp -f compose/infra.yaml up -d
# Fullstack: add Valkey, Postgres, Keycloak (use with fullstack .env).
#   docker compose -p squadrules-mcp -f compose/infra.yaml --profile fullstack up -d
# Optional UI (only with fullstack): docker compose -p squadrules-mcp -f compose/infra.yaml --profile fullstack --profile infra-ui up -d
#
# Variable interpolation reads compose/.env (this file's directory), NOT the repo-root .env, so
# qdrant's `${QDRANT_API_KEY:?...}` guard fails unless you either pass `--env-file .env` from the
# repo root (as every documented invocation above does) or create the gitignored symlink
# `compose/.env -> ../.env` (`.devcontainer/devcontainer.json` initializeCommand does this, because
# the Dev Containers CLI runs compose without `--env-file`).

# Explicit so that invocations without `-p` (including the Dev Containers CLI's own compose calls)
# reuse this one stack instead of creating a second project named after the `compose/` directory,
# which would collide on the published ports below and split the network.
name: squadrules-mcp

services:
  valkey:
    profiles:
      - fullstack
    image: valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    pull_policy: missing
    environment:
      KEY_VALUE_STORE_PASSWORD: ${KEY_VALUE_STORE_PASSWORD:-${REDIS_PASSWORD:-}}
    command: >
      sh -c 'if [ -z "$$KEY_VALUE_STORE_PASSWORD" ]; then echo "KEY_VALUE_STORE_PASSWORD (or REDIS_PASSWORD legacy alias) must be set when fullstack profile enables valkey" >&2; exit 1; fi; exec valkey-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly yes --requirepass "$$KEY_VALUE_STORE_PASSWORD"'
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    networks:
      - squadrules-network
    healthcheck:
      test: [ "CMD-SHELL", "valkey-cli -a \"$$KEY_VALUE_STORE_PASSWORD\" ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Optional UI for Valkey/Redis-compatible stores; use with fullstack.
  redisinsight:
    profiles:
      - infra-ui
    image: redis/redisinsight:3.2.0@sha256:55542a762210bb1cd681410282642bac0970f780f39bc134565394a81b1f1fd9
    pull_policy: missing
    depends_on:
      - valkey
    ports:
      - "5540:5540"
    environment:
      - RI_REDIS_HOST*=valkey
      - RI_REDIS_PORT*=6379
      - RI_REDIS_ALIAS*=squadrulesKeyValue
    volumes:
      - redisinsight-data:/data
    networks:
      - squadrules-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.1@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
    pull_policy: missing
    ports:
      - "6333:6333"
      - "6344:6344"
    volumes:
      - qdrant-data:/qdrant/storage
    env_file:
      - ../.env
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6534
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
      # Performance optimization for production
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__MAX_WORKING_MEMORY_MB=4096
    networks:
      - squadrules-network
    restart: unless-stopped

    #
    healthcheck:
      test: >
        fgrep -qa ':18BD ' /proc/net/tcp
      interval: 30s
      timeout: 5s
      retries: 3
    #   start_period: 3s

  # --- Postgres: Keycloak DB only (default Docker workflow via env). Regenerate: python3 scripts/deploy-generate-dev-secrets.py --ci ---
  postgres:
    profiles:
      - fullstack
    image: postgres:18.3-alpine3.22@sha256:af27ebd3413839ccfdcdf88e91ca76ad82117e52192067b76de9bb5be7ea6e04
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      POSTGRES_DB: keycloak
    volumes:
      # PostgreSQL 18+ stores data in a major-version-specific subdirectory.
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - squadrules-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Keycloak OIDC (see docs/plans/keycloak-oidc-dev.md). DB: postgres service, keycloak DB/user ---
  keycloak:
    profiles:
      - fullstack
    env_file:
      - ../.env
    image: quay.io/keycloak/keycloak:26.5.4@sha256:ae8efb0d218d8921334b03a2dbee7069a0b868240691c50a3ffc9f42fabba8b4
    depends_on:
      postgres:
        condition: service_healthy
    # Idempotent realm setup via scripts/deploy-configure-keycloak-realms.py only (run it after `docker compose ... --profile fullstack up -d`). Do not add --import-realm.
    # Group mapper `full.path` is always applied by deploy-configure-keycloak-realms.py (not a Keycloak KC_* env var).
    command:
      - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    # No bind mount: realm JSONs live in scripts/keycloak/import; use scripts/deploy-configure-keycloak-realms.py to create realms via API.
    networks:
      - squadrules-network
    restart: unless-stopped

  # Dev tooling container for devcontainer.json `service` target. The Node app runs via npm
  # inside this container (workspace mounted at /workspace) and is started by the devcontainer
  # postStartCommand (scripts/deploy-devcontainer-cluster.mjs) - there is still no app *service*
  # here; app images are built in SquadRules/containers.
  #
  # Debian/glibc base, not Alpine: server boot awaits an embedding-dimension probe
  # (src/runtime/boot-local-runtime.ts -> ensureEmbeddingDimension), and the zero-key local
  # provider (fastembed) loads onnxruntime-node, whose published linux binaries are glibc-only.
  # On musl the require fails with "ld-linux-aarch64.so.1: No such file or directory", so the app
  # cannot boot. node/npm/git/python3/curl/jq come from this image, so the devcontainer needs no
  # node feature. Infra lifecycle stays host-side (devcontainer initializeCommand), so this
  # service mounts no Docker socket: root + a Docker socket is host root.
  dev:
    image: mcr.microsoft.com/devcontainers/typescript-node:26@sha256:2c3598b6879cab98033bcad0952c7192f217265e2f7bdfa47a738acbde3e8355
    pull_policy: missing
    # Wait until Qdrant answers in-network (same probe as scripts/ci-wait-for-infra.sh), then idle.
    command: ["bash", "-c", "until curl -sf http://qdrant:6333/healthz >/dev/null 2>&1; do sleep 5; done; echo 'infra ready'; exec sleep infinity"]
    volumes:
      - ../.env:/workspace/.env:ro
      - ..:/workspace
    working_dir: /workspace
    networks:
      - squadrules-network

networks:
  squadrules-network:
    driver: bridge

volumes:
  valkey-data:
  redisinsight-data:
  qdrant-data:
  postgres-data:
